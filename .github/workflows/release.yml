name: Release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new OpenCode release
        id: check
        run: |
          # Fetch latest OpenCode release
          OPENCODE_JSON=$(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest)
          OPENCODE_VERSION=$(echo "$OPENCODE_JSON" | grep '"tag_name"' | sed 's/.*"tag_name": *"v\?\([^"]*\)".*/\1/')
          OPENCODE_BODY=$(echo "$OPENCODE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))")
          echo "opencode_version=$OPENCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "opencode_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OPENCODE_BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Fetch latest release in this repo
          RELEASES_JSON=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/latest" 2>/dev/null || echo '{}')
          OUR_VERSION=$(echo "$RELEASES_JSON" | grep '"tag_name"' | sed 's/.*"tag_name": *"v\?\([^"]*\)".*/\1/' || true)

          echo "our_version=$OUR_VERSION" >> "$GITHUB_OUTPUT"
          echo "OpenCode latest: v$OPENCODE_VERSION"
          echo "Our latest: v$OUR_VERSION"

          if [ "$OPENCODE_VERSION" = "$OUR_VERSION" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Versions match, skipping build."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "New version available: v$OPENCODE_VERSION"
          fi

      - name: Skip if up to date
        if: steps.check.outputs.up_to_date == 'true'
        run: echo "Already up to date, nothing to do."

      - name: Set up Bun
        if: steps.check.outputs.up_to_date == 'false'
        uses: oven-sh/setup-bun@v2

      - name: Install build dependencies
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3 git make curl dpkg-dev

      - name: Download Android NDK
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          curl -fSL -o /tmp/ndk.zip "$NDK_URL"
          unzip -q /tmp/ndk.zip -d /opt
          rm /tmp/ndk.zip
          echo "NDK_ROOT=/opt/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Build bun-termux wrapper
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git clone --depth 1 https://github.com/Happ1ness-dev/bun-termux.git /tmp/bun-termux
          cd /tmp/bun-termux

          # Use NDK's clang (not system clang) for Android cross-compilation
          NDK_TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          NDK_CLANG="$NDK_TOOLCHAIN/bin/clang"

          # Build the wrapper with Android target
          "$NDK_CLANG" \
            --target=aarch64-linux-android24 \
            -Wall -Wextra -Werror=implicit-function-declaration \
            -Werror=format-security -O2 \
            -Wl,-z,norelro \
            -o bun-termux bun-termux.c

          echo "bun-termux wrapper built successfully"
          file bun-termux

      - name: Download OpenCode binary
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          VERSION="${{ steps.check.outputs.opencode_version }}"
          curl -fSL -o /tmp/opencode.tar.gz \
            "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/opencode-linux-arm64.tar.gz"
          mkdir -p /tmp/opencode-build
          tar -xzf /tmp/opencode.tar.gz -C /tmp/opencode-build/
          ls -la /tmp/opencode-build/

      - name: Wrap binary with bun-termux
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          cd /tmp/bun-termux
          INPUT=$(find /tmp/opencode-build -name 'opencode*' -type f -executable | head -1)
          if [ -z "$INPUT" ]; then
            INPUT=$(find /tmp/opencode-build -name 'opencode*' -type f | head -1)
          fi
          echo "Input binary: $INPUT"

          python3 helper_scripts/replace_runtime.py "$INPUT" /tmp/opencode-termux --wrapper ./bun-termux

          echo "Wrapped binary:"
          file /tmp/opencode-termux

      - name: Build .deb package
        if: steps.check.outputs.up_to_date == 'false'
        id: build
        run: |
          VERSION="${{ steps.check.outputs.opencode_version }}"
          ARCH="aarch64"
          DEB_NAME="opencode_${VERSION}_${ARCH}.deb"
          DEB_ROOT="/tmp/deb-root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/bin"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode/runtime"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode/lib"

          # Copy wrapped binary
          cp /tmp/opencode-termux "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode/runtime/opencode"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode/runtime/opencode"

          # Copy launcher script
          cp resources/launcher.sh "$DEB_ROOT/data/data/com.termux/files/usr/bin/opencode"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/bin/opencode"

          # Create control file
          printf '%s\n' \
            "Package: opencode" \
            "Version: $VERSION" \
            "Architecture: $ARCH" \
            "Maintainer: opencode-termux <opencode@termux.dev>" \
            "Section: utils" \
            "Priority: optional" \
            "Description: OpenCode CLI for Termux (AI coding assistant)" \
            "Depends: glibc, openssl-glibc, bash, ncurses" \
            "Suggests: glibc-runner" \
            > "$DEB_ROOT/DEBIAN/control"

          # Calculate installed size
          SIZE=$(du -sk "$DEB_ROOT" | cut -f1)
          echo "Installed-Size: $SIZE" >> "$DEB_ROOT/DEBIAN/control"

          # Build .deb
          dpkg-deb --build "$DEB_ROOT" "/tmp/$DEB_NAME"

          # Copy to workspace
          mkdir -p "${{ github.workspace }}/release"
          cp "/tmp/$DEB_NAME" "${{ github.workspace }}/release/"
          echo "deb_path=release/$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "deb_file=$DEB_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Bun binary
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          BUN_JSON=$(curl -fsSL https://api.github.com/repos/oven-sh/bun/releases/latest)
          BUN_VERSION=$(echo "$BUN_JSON" | grep '"tag_name"' | sed 's/.*"tag_name": *"bun-v\([^"]*\)".*/\1/')
          echo "Bun version: $BUN_VERSION"

          curl -fSL -o /tmp/bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-aarch64-android.zip"
          mkdir -p /tmp/bun-build
          unzip -q /tmp/bun.zip -d /tmp/bun-build/
          ls -la /tmp/bun-build/

          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Bun binary
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          # Bun Android release is already a native Android binary (uses /system/bin/linker64),
          # so it doesn't need bun-termux wrapping like the OpenCode binary does.
          INPUT=$(find /tmp/bun-build -name 'bun' -type f -executable | head -1)
          if [ -z "$INPUT" ]; then
            INPUT=$(find /tmp/bun-build -name 'bun' -type f | head -1)
          fi
          echo "Input binary: $INPUT"

          cp "$INPUT" /tmp/bun-termux-bin
          chmod 755 /tmp/bun-termux-bin

          echo "Bun binary (native Android, no wrapping needed):"
          file /tmp/bun-termux-bin

      - name: Build bun .deb package
        if: steps.check.outputs.up_to_date == 'false'
        id: build-bun
        run: |
          OPENCODE_VERSION="${{ steps.check.outputs.opencode_version }}"
          BUN_VERSION="${{ steps.check.outputs.bun_version }}"
          ARCH="aarch64"
          DEB_NAME="bun_${BUN_VERSION}_${ARCH}.deb"
          DEB_ROOT="/tmp/bun-deb-root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/bin"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/lib/bun/runtime"

          # Copy wrapped binary
          cp /tmp/bun-termux-bin "$DEB_ROOT/data/data/com.termux/files/usr/lib/bun/runtime/bun"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/lib/bun/runtime/bun"

          # Copy launcher script
          cp resources/bun-launcher.sh "$DEB_ROOT/data/data/com.termux/files/usr/bin/bun"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/bin/bun"

          # Create symlinks for node and npm
          cd "$DEB_ROOT/data/data/com.termux/files/usr/bin"
          ln -sf bun node
          ln -sf bun npm
          ln -sf bun npx
          cd -

          # Create control file
          printf '%s\n' \
            "Package: bun-termux" \
            "Version: $BUN_VERSION" \
            "Architecture: $ARCH" \
            "Maintainer: opencode-termux <opencode@termux.dev>" \
            "Section: devel" \
            "Priority: optional" \
            "Description: Bun runtime for Termux (without proot)" \
            "Depends: bash, glibc-repo, glibc, openssl-glibc" \
            "Suggests: glibc-runner" \
            > "$DEB_ROOT/DEBIAN/control"

          # Calculate installed size
          SIZE=$(du -sk "$DEB_ROOT" | cut -f1)
          echo "Installed-Size: $SIZE" >> "$DEB_ROOT/DEBIAN/control"

          # Build .deb
          dpkg-deb --build "$DEB_ROOT" "/tmp/$DEB_NAME"

          # Copy to workspace
          mkdir -p "${{ github.workspace }}/release"
          cp "/tmp/$DEB_NAME" "${{ github.workspace }}/release/"
          echo "bun_deb_path=release/$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "bun_deb_file=$DEB_NAME" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check.outputs.up_to_date == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.opencode_version }}
          name: v${{ steps.check.outputs.opencode_version }}
          body: |
            # OpenCode for Termux ${{ steps.check.outputs.opencode_version }}

            ## Release note from [OpenCode](https://github.com/anomalyco/opencode)

            ${{ steps.check.outputs.opencode_body }}

            ## Packages

            ### opencode_${{ steps.check.outputs.opencode_version }}_aarch64.deb
            OpenCode CLI for Termux (AI coding assistant)

            ### bun_${{ steps.check.outputs.bun_version }}_aarch64.deb
            Bun runtime for Termux (without proot)

            > [!NOTE]
            > Installing the bun package will automatically install glibc dependencies (glibc-repo, glibc, openssl-glibc).

            ## How to install?

            ### First time (For users who are not developing locally and have not installed dependencies)
            ```bash
            apt install -y glibc-repo && apt update && apt install -y glibc openssl-glibc
            curl -fsSL https://raw.githubusercontent.com/sang765/opencode-termux-setup/main/install.sh | bash
            ```

            ### Already installed dependencies
            ```bash
            curl -fsSL https://raw.githubusercontent.com/sang765/opencode-termux-setup/main/install.sh | bash
            ```

            This Bash script file will automatically find the latest .deb file in the latest release, download it, and install it for you with `dpkg -i` command.
          draft: false
          files: |
            ${{ github.workspace }}/release/${{ steps.build.outputs.deb_file }}
            ${{ github.workspace }}/release/${{ steps.build-bun.outputs.bun_deb_file }}
          prerelease: false
