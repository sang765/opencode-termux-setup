name: Check upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm install
      - name: Check latest upstream version
        id: check
        run: |
          LATEST=$(npm view opencode-linux-arm64 version)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
      - name: Create issue if outdated
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.check.outputs.latest }}';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['upstream-update']
            });
            const exists = issues.some(i => i.title.includes(latest));
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Upstream v${latest} is available`,
                body: `A new version of opencode-linux-arm64 (v${latest}) is available.\n\nRun \`npx -y github:${context.repo.owner}/${context.repo.repo}\` to build and install it.`,
                labels: ['upstream-update']
              });
            }
