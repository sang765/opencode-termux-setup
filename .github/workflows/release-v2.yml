name: Release V2

on:
  schedule:
    # Offset from release.yml so the two streams don't fire at the same instant
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for new OpenCode V2 release
        id: check
        run: |
          # V2 has no upstream GitHub releases; npm is the source of truth for the version
          V2_JSON=$(curl -fsSL https://registry.npmjs.org/@opencode/cli-linux-arm64/latest)
          V2_VERSION=$(echo "$V2_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "opencode2_version=$V2_VERSION" >> "$GITHUB_OUTPUT"

          # Up to date only when this repo already published the opencode2 .deb:
          # both streams share the v<version> tag namespace, so the tag alone is ambiguous.
          V2_DEB="opencode2_${V2_VERSION}_aarch64.deb"
          V2_REL_JSON=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${V2_VERSION}")
          V2_PUBLISHED=$(printf '%s' "$V2_REL_JSON" \
            | python3 -c "import json,sys; print('true' if sys.argv[1] in [a['name'] for a in json.load(sys.stdin).get('assets',[])] else 'false')" "$V2_DEB")
          echo "OpenCode V2 latest: v$V2_VERSION ($V2_DEB published: $V2_PUBLISHED)"

          if [ "$V2_PUBLISHED" = "true" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "V2 release v$V2_VERSION already has $V2_DEB, skipping build."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "New V2 version available: v$V2_VERSION"
          fi

      - name: Skip if up to date
        if: steps.check.outputs.up_to_date == 'true'
        run: echo "Already up to date, nothing to do."

      - name: Install build dependencies
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3 git make curl dpkg-dev

      - name: Download Android NDK
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          curl -fSL -o /tmp/ndk.zip "$NDK_URL"
          unzip -q /tmp/ndk.zip -d /opt
          rm /tmp/ndk.zip
          echo "NDK_ROOT=/opt/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Build bun-termux wrapper
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git clone --depth 1 https://github.com/Happ1ness-dev/bun-termux.git /tmp/bun-termux
          cd /tmp/bun-termux

          # Use NDK's clang (not system clang) for Android cross-compilation
          NDK_TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          NDK_CLANG="$NDK_TOOLCHAIN/bin/clang"

          # Build the wrapper with Android target
          "$NDK_CLANG" \
            --target=aarch64-linux-android24 \
            -Wall -Wextra -Werror=implicit-function-declaration \
            -Werror=format-security -O2 \
            -Wl,-z,norelro \
            -o bun-termux bun-termux.c

          echo "bun-termux wrapper built successfully"
          file bun-termux

      - name: Download OpenCode V2 binary
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          VERSION="${{ steps.check.outputs.opencode2_version }}"
          mkdir -p /tmp/opencode2-build

          # Same source order as src/download.ts: npm first, opencode.ai tarball as fallback
          if NPM_TARBALL=$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-arm64/${VERSION}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['dist']['tarball'])"); then
            curl -fSL -o /tmp/opencode2.tar.gz "$NPM_TARBALL"
          else
            curl -fSL -o /tmp/opencode2.tar.gz \
              "https://opencode.ai/files/bin/${VERSION}/opencode-linux-arm64.tar.gz"
          fi

          tar -xzf /tmp/opencode2.tar.gz -C /tmp/opencode2-build/
          ls -la /tmp/opencode2-build/

      - name: Wrap V2 binary with bun-termux
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          cd /tmp/bun-termux
          INPUT=$(find /tmp/opencode2-build -name 'opencode*' -type f -executable | head -1)
          if [ -z "$INPUT" ]; then
            INPUT=$(find /tmp/opencode2-build -name 'opencode*' -type f | head -1)
          fi
          if [ -z "$INPUT" ]; then
            echo "No opencode binary found in the extracted tarball" >&2
            exit 1
          fi
          echo "Input binary: $INPUT"

          python3 helper_scripts/replace_runtime.py "$INPUT" /tmp/opencode2-termux --wrapper ./bun-termux

          echo "Wrapped binary:"
          file /tmp/opencode2-termux

      - name: Build opencode2 .deb package
        if: steps.check.outputs.up_to_date == 'false'
        id: build
        run: |
          VERSION="${{ steps.check.outputs.opencode2_version }}"
          ARCH="aarch64"
          DEB_NAME="opencode2_${VERSION}_${ARCH}.deb"
          DEB_ROOT="/tmp/deb-root-v2"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/bin"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode2/runtime"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode2/lib"

          # Copy wrapped binary (runtime file name stays "opencode")
          cp /tmp/opencode2-termux "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode2/runtime/opencode"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/lib/opencode2/runtime/opencode"

          # Copy launcher script with V2 lib paths (no statx shim shipped)
          sed -e 's|\.\./lib/opencode/|../lib/opencode2/|g' \
              -e 's|opencode: no runtime found|opencode2: no runtime found|' \
              resources/launcher.sh \
              > "$DEB_ROOT/data/data/com.termux/files/usr/bin/opencode2"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/bin/opencode2"

          # Create control file
          printf '%s\n' \
            "Package: opencode2" \
            "Version: $VERSION" \
            "Architecture: $ARCH" \
            "Maintainer: opencode-termux <opencode@termux.dev>" \
            "Section: utils" \
            "Priority: optional" \
            "Description: OpenCode V2 CLI for Termux (AI coding assistant)" \
            "Depends: glibc, openssl-glibc, bash, ncurses" \
            "Suggests: glibc-runner" \
            > "$DEB_ROOT/DEBIAN/control"

          # Calculate installed size
          SIZE=$(du -sk "$DEB_ROOT" | cut -f1)
          echo "Installed-Size: $SIZE" >> "$DEB_ROOT/DEBIAN/control"

          # Build .deb
          dpkg-deb --build "$DEB_ROOT" "/tmp/$DEB_NAME"

          # Copy to workspace
          mkdir -p "${{ github.workspace }}/release"
          cp "/tmp/$DEB_NAME" "${{ github.workspace }}/release/"
          echo "deb_path=release/$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "deb_file=$DEB_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Bun binary
        if: steps.check.outputs.up_to_date == 'false'
        id: download-bun
        run: |
          BUN_JSON=$(curl -fsSL https://api.github.com/repos/oven-sh/bun/releases/latest)
          BUN_VERSION=$(echo "$BUN_JSON" | grep '"tag_name"' | sed 's/.*"tag_name": *"bun-v\([^"]*\)".*/\1/')
          echo "Bun version: $BUN_VERSION"

          curl -fSL -o /tmp/bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-aarch64-android.zip"
          mkdir -p /tmp/bun-build
          unzip -q /tmp/bun.zip -d /tmp/bun-build/
          ls -la /tmp/bun-build/

          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Bun binary
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          # Bun Android release is already a native Android binary (uses /system/bin/linker64),
          # so it doesn't need bun-termux wrapping like the OpenCode binary does.
          INPUT=$(find /tmp/bun-build -name 'bun' -type f -executable | head -1)
          if [ -z "$INPUT" ]; then
            INPUT=$(find /tmp/bun-build -name 'bun' -type f | head -1)
          fi
          echo "Input binary: $INPUT"

          cp "$INPUT" /tmp/bun-termux-bin
          chmod 755 /tmp/bun-termux-bin

          echo "Bun binary (native Android, no wrapping needed):"
          file /tmp/bun-termux-bin

      - name: Build bun .deb package
        if: steps.check.outputs.up_to_date == 'false'
        id: build-bun
        run: |
          BUN_VERSION="${{ steps.download-bun.outputs.bun_version }}"
          ARCH="aarch64"
          DEB_NAME="bun_${BUN_VERSION}_${ARCH}.deb"
          DEB_ROOT="/tmp/bun-deb-root"

          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/bin"
          mkdir -p "$DEB_ROOT/data/data/com.termux/files/usr/lib/bun/runtime"

          # Copy wrapped binary
          cp /tmp/bun-termux-bin "$DEB_ROOT/data/data/com.termux/files/usr/lib/bun/runtime/bun"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/lib/bun/runtime/bun"

          # Copy launcher script
          cp resources/bun-launcher.sh "$DEB_ROOT/data/data/com.termux/files/usr/bin/bun"
          chmod 755 "$DEB_ROOT/data/data/com.termux/files/usr/bin/bun"

          # Create symlinks for node and npm
          cd "$DEB_ROOT/data/data/com.termux/files/usr/bin"
          ln -sf bun node
          ln -sf bun npm
          ln -sf bun npx
          cd -

          # Create control file
          printf '%s\n' \
            "Package: bun-termux" \
            "Version: $BUN_VERSION" \
            "Architecture: $ARCH" \
            "Maintainer: opencode-termux <opencode@termux.dev>" \
            "Section: devel" \
            "Priority: optional" \
            "Description: Bun runtime for Termux (without proot)" \
            "Depends: bash, glibc-repo, glibc, openssl-glibc" \
            "Suggests: glibc-runner" \
            > "$DEB_ROOT/DEBIAN/control"

          # Calculate installed size
          SIZE=$(du -sk "$DEB_ROOT" | cut -f1)
          echo "Installed-Size: $SIZE" >> "$DEB_ROOT/DEBIAN/control"

          # Build .deb
          dpkg-deb --build "$DEB_ROOT" "/tmp/$DEB_NAME"

          # Copy to workspace
          mkdir -p "${{ github.workspace }}/release"
          cp "/tmp/$DEB_NAME" "${{ github.workspace }}/release/"
          echo "bun_deb_path=release/$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "bun_deb_file=$DEB_NAME" >> "$GITHUB_OUTPUT"

      - name: Create V2 release
        if: steps.check.outputs.up_to_date == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check.outputs.opencode2_version }}
          name: v${{ steps.check.outputs.opencode2_version }}
          body: |
            # OpenCode V2 for Termux ${{ steps.check.outputs.opencode2_version }}

            ## Packages

            ### opencode2_${{ steps.check.outputs.opencode2_version }}_aarch64.deb
            OpenCode V2 CLI for Termux (AI coding assistant)

            ### bun_${{ steps.download-bun.outputs.bun_version }}_aarch64.deb
            Bun runtime for Termux (without proot)

            > [!NOTE]
            > Installing the bun package will automatically install glibc dependencies (glibc-repo, glibc, openssl-glibc).

            ## How to install?

            ### First time (For users who are not developing locally and have not installed dependencies)
            ```bash
            apt install -y glibc-repo && apt update && apt install -y glibc openssl-glibc
            curl -fsSL https://raw.githubusercontent.com/sang765/opencode-termux-setup/main/install.sh | bash -s -- --v2
            ```

            ### Already installed dependencies
            ```bash
            curl -fsSL https://raw.githubusercontent.com/sang765/opencode-termux-setup/main/install.sh | bash -s -- --v2
            ```

            Omit `--v2` to install the V1 stream (default). The script searches recent releases for the matching .deb, downloads it, and installs it for you with `dpkg -i` command.
          draft: false
          files: |
            ${{ github.workspace }}/release/${{ steps.build.outputs.deb_file }}
            ${{ github.workspace }}/release/${{ steps.build-bun.outputs.bun_deb_file }}
          prerelease: false
